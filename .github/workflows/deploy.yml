name: Deploy Next.js

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_ACCOUNT }}/
          local-dir: ./
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json

          exclude: |
            **/.git*
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/.DS_Store
            **/Thumbs.db

            **/.env
            **/.env.*
            **/.eslintcache

            **/node_modules/**
            **/.next/**
            **/.turbo/**
            **/.vercel/**
            **/coverage/**
            **/cypress/**
            **/playwright-report/**
            **/test-results/**
            **/tests/**
            **/logs/**
            **/tmp/**

            **/README.md
            **/CHANGELOG.md
            **/LICENSE

            **/*.log
            **/*.map

            **/npm-debug.log*
            **/yarn-debug.log*
            **/yarn-error.log*
            **/pnpm-debug.log*
